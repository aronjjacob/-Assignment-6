services:
  - type: web
    name: photo-album-manager
    env: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn recipe_project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: recipe_project.settings

  - type: postgresql
    name: photo-album-db
    plan: free
    ipAllowList: []  # Allow all IPs to connect (adjust for security)

databases:
  - name: photo-album-db
    plan: free
