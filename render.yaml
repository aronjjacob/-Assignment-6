services:
  - type: web
    name: photo-album-manager
    env: python
    plan: free
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input --clear && python manage.py migrate
    startCommand: gunicorn recipe_project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: recipe_project.settings

  - type: postgresql
    name: photo-album-db
    plan: free
    ipAllowList: []  # Allow all IPs to connect (adjust for security)

databases:
  - name: photo-album-db
    plan: free
