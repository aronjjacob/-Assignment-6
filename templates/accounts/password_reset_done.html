{% extends 'base/base.html' %}

{% block title %}Password Reset Sent - Photo Album Manager{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto;">
    <div class="card">
        <div class="card-body">
            <h2 style="color: var(--success);">Email Sent!</h2>
            <p>Check your email for a link to reset your password. If you don't see it, check your spam folder.</p>
            <a href="{% url 'login' %}" class="btn btn-primary">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
